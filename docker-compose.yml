services:
  postgres:
    image: postgres:17-alpine
    container_name: mentor-ai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mentorai
      POSTGRES_USER: mentorai
      POSTGRES_PASSWORD: mentorai
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

volumes:
  postgres_data:
